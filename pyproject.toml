[project]
name = "solving-chemical-engineering-problems"
version = "0.1.0"
description = "Solving chemical engineering problems using Python and Jupyter Notebooks"
authors = [
    {name = "IZelioli",email = "i.augustomz@gmail.com"}
]
readme = "README.md"
requires-python = "^3.14"
dependencies = [
    "numpy (>=2.5.3,<3.0.0)",
    "scipy (>=1.18.1,<2.0.0)",
    "matplotlib (>=3.11.2,<4.0.0)",
    "pandas (>=3.0.6,<4.0.0)",
    "sympy (>=1.14.0,<2.0.0)",
    "ipykernel (>=7.3.0,<8.0.0)",
    "pint (>=0.26.1,<0.27.0)"
]


[tool.poetry]
packages = [{include = "src"}]

[tool.poetry.group.dev.dependencies]
pytest = "^7.0.0"
pytest-cov = "^4.0.0"
black = "^24.0.0"
isort = "^5.13.0"
pylint = "^3.0.0"
flake8 = "^7.0.0"

[tool.black]
line-length = 88
target-version = ['py313']
include = '\.pyi?$'
exclude = '''
/(
    \.git
  | \.hg
  | \.mypy_cache
  | \.tox
  | \.venv
  | _build
  | buck-out
  | build
  | dist
)/
'''

[tool.isort]
profile = "black"
line_length = 88
skip_gitignore = true
known_first_party = ["src"]

[tool.pylint.messages_control]
disable = [
    "C0111",  # missing-docstring
    "C0103",  # invalid-name
    "R0913",  # too-many-arguments
    "R0914",  # too-many-locals
]

[tool.pylint.format]
max-line-length = 88

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

